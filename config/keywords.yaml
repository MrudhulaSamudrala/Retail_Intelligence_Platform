# Share of Voice / search visibility keywords.
# Implementation assumption: keyword list was NOT supplied by Bridge AI.
# Small, defensible gaming purchase-intent sets per retailer/country.
# Add/remove queries here without changing Python code.
# See docs/assumptions.md (A12/A13) and docs/methodology.md (Share of Voice).

retailers:
  newegg:
    countries:
      US:
        language: en
        queries:
          - gaming laptop
          - gaming notebook
          - gaming desktop
          - rtx gaming laptop
          - ryzen gaming laptop
          - intel gaming laptop

  mercadolibre:
    countries:
      BR:
        language: pt-BR
        queries:
          - notebook gamer
          - notebook gamer rtx
          - notebook gamer ryzen
          - pc gamer
          - desktop gamer

share_of_voice:
  # Denominator = tracked-brand search-result appearances only.
  # UNKNOWN is stored but excluded unless include_unknown_in_sov_denominator is true.
  tracked_brands:
    - Intel
    - AMD
    - Qualcomm
    - Apple
  include_unknown_in_sov_denominator: false
  # Preferred reporting Top-N values (configurable; not hardcoded to a single N).
  top_n_options:
    - 3
    - 5
    - 10
    - 20
  default_top_n: 10
  # When sponsored flags are available, prefer organic for exact SoV reporting.
  prefer_organic: true
  attribute_by: brand

pagination:
  max_pages: 3
  max_results_per_keyword: 60
  stop_on_empty_page: true

# Collection completeness labels used on search_observations.collection_status
collection_statuses:
  - COMPLETE
  - PARTIAL
  - FAILED
  - ZERO_RESULTS
