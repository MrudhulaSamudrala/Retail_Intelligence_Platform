# Retail platforms in scope for this assessment.

retailers:
  - code: newegg
    name: Newegg
    country_code: US
    country_name: United States
    currency: USD
    base_url: https://www.newegg.com
    locale: en-US
    collector_module: collector.retailers.newegg
    enabled: true
    collection:
      pricing_promotions_per_day: 3
      audits_per_day: 3
      banners_per_day: 1
      share_of_voice_per_day: 1

  - code: mercadolibre
    name: Mercado Libre
    country_code: BR
    country_name: Brazil
    currency: BRL
    base_url: https://www.mercadolivre.com.br
    locale: pt-BR
    collector_module: collector.retailers.mercadolibre
    enabled: true
    collection:
      pricing_promotions_per_day: 3
      audits_per_day: 3
      banners_per_day: 1
      share_of_voice_per_day: 1

scheduling:
  # Cron expressions for Render Cron Jobs (UTC). See docs/deployment.md.
  # Production runner: python -m collector.run --all at 08:00 / 14:00 / 20:00 UTC.
  pricing_audit_cron: "0 8,14,20 * * *"
  banner_cron: "0 8,14,20 * * *"
  production_cron: "0 8,14,20 * * *"
  timezone: UTC
