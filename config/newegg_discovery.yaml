# Newegg US controlled collection scope for the prototype.
# Implementation assumption: start with gaming notebooks + gaming desktops
# search entry points (purchase-intent, in-scope product types).

retailer_code: newegg
country_code: US
currency: USD

discovery:
  - name: gaming_laptops
    product_type_hint: notebook
    url: "https://www.newegg.com/p/pl?d=gaming+laptop&Order=1"
  - name: gaming_desktops
    product_type_hint: desktop
    url: "https://www.newegg.com/p/pl?d=gaming+desktop&Order=1"
  - name: graphics_cards_gaming
    product_type_hint: gpu
    url: "https://www.newegg.com/p/pl?d=rtx+graphics+card&Order=1"

limits:
  max_pages_per_query: 1
  min_title_length: 8
