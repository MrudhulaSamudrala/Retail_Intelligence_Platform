# Newegg US controlled collection scope for the prototype.
# One clearly defined gaming-related search: Best Match "gaming laptop".
# (Avoid Order=1 / Lowest Price — that surfaces accessories and junk listings.)

retailer_code: newegg
country_code: US
currency: USD

discovery:
  - name: gaming_laptops
    product_type_hint: notebook
    url: "https://www.newegg.com/p/pl?d=gaming+laptop"

limits:
  max_pages_per_query: 1
  min_title_length: 8
