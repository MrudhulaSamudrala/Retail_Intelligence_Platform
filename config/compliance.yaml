# Retailer audit checks and Overall Brand Compliance Score weights.
# Check definitions below match the project brief (S1, S2, P1–P5).
# Operational matching rules live in collector/audit/.

audit_checks:
  - code: S1
    name: Listing title brand / processor visibility
    group: listing
    description: >
      Listing page title includes brand name and/or brand-specific processor line.
  - code: S2
    name: Listing tile brand badge
    group: listing
    description: >
      Brand badge is present on the listing tile.
  - code: P1
    name: Product page title branding
    group: product_page
    description: >
      Product page title includes brand name, processor line or generation.
  - code: P2
    name: Product page brand badge
    group: product_page
    description: >
      Brand badge is present on the product page.
  - code: P3
    name: Specification table brand / processor
    group: product_page
    description: >
      Brand or processor line appears in the specification table.
  - code: P4
    name: Brand-led rich media
    group: product_page
    description: >
      Brand-led rich media is present on the product page.
  - code: P5
    name: OEM rich media
    group: product_page
    description: >
      OEM rich media is present on the product page.

# Equal weighting across the seven audit checks (implementation assumption).
# Overall compliance score is NOT computed in the audit-engine phase.
check_weights:
  S1: 0.142857
  S2: 0.142857
  P1: 0.142857
  P2: 0.142857
  P3: 0.142857
  P4: 0.142857
  P5: 0.142857

# Overall Brand Compliance Score segment weights (from brief).
segment_weights:
  notebook: 0.85
  desktop: 0.15

# UNKNOWN handling (implementation assumption):
# UNKNOWN is excluded from the compliance denominator and reported separately
# as coverage / data completeness. Missing evidence must never become PASS.
unknown_handling:
  exclude_from_score_denominator: true
  report_coverage_separately: true
  valid_results:
    - PASS
    - FAIL
    - UNKNOWN

# Deterministic signal patterns for badge / rich-media checks.
# Matching uses alphanumeric token boundaries where applicable.
brand_badge_patterns:
  Intel:
    - intel inside
    - intel®
    - intel core
    - intel ultra
    - intel
  AMD:
    - amd ryzen
    - amd radeon
    - amd®
    - ryzen
    - amd
  Qualcomm:
    - qualcomm snapdragon
    - snapdragon
    - qualcomm
  Apple:
    - apple silicon
    - apple m
    - designed by apple
    - apple

oem_rich_media_patterns:
